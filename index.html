<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SWARM — juicy survival</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #07070d; color: #d7d7e0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; user-select: none; overflow: hidden;
  }
  h1 { margin: 0; font-size: 16px; letter-spacing: 4px; color: #9fd6ff; font-weight: 700; }
  #wrap { position: relative; }
  canvas {
    background: #05050a; border: 1px solid #1c2030; border-radius: 8px;
    box-shadow: 0 12px 50px rgba(0,0,0,.7); display: block;
  }
  #hud {
    position: absolute; top: 10px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; pointer-events: none;
    font-size: 13px; text-shadow: 0 1px 3px #000;
  }
  #lvlbar {
    position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: #14182a;
  }
  #lvlfill { height: 100%; width: 0%; background: linear-gradient(90deg,#5ad1ff,#8effc0); transition: width .08s; }
  #help { font-size: 12px; color: #6f6f8a; }
  #help kbd { background:#16182a;border:1px solid #2a2e44;border-radius:4px;padding:1px 6px;color:#cfcfe6; }
  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; background:rgba(5,5,10,.85);
    border-radius:8px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { margin:0; font-size:30px; letter-spacing:3px; }
  #overlay .sub { color:#9a9ab4; font-size:13px; }
  .cards { display:flex; gap:12px; margin-top:6px; }
  .card {
    pointer-events:auto; cursor:pointer; width:150px; padding:14px 12px;
    background:#11142400; border:1px solid #2a3050; border-radius:8px;
    background:#0d1020; transition:.12s; text-align:left;
  }
  .card:hover { border-color:#5ad1ff; transform:translateY(-3px); background:#121734; }
  .card .t { color:#9fd6ff; font-size:14px; font-weight:700; margin-bottom:4px; }
  .card .d { color:#8a8aa6; font-size:11px; line-height:1.5; }
  .btn {
    pointer-events:auto; cursor:pointer; margin-top:6px; padding:8px 18px;
    background:#1a2140; border:1px solid #3a4570;
    border-radius:6px; color:#cfe6ff; font-family:inherit; font-size:13px;
  }
  .btn:hover { background:#243066; }
</style>
</head>
<body>
  <h1>S W A R M</h1>
  <div id="wrap">
    <canvas id="game" width="720" height="520"></canvas>
    <div id="lvlbar"><div id="lvlfill"></div></div>
    <div id="hud">
      <span style="color:#8effc0">LVL <span id="lvl">1</span></span>
      <span style="color:#ffd25a">TIME <span id="time">0</span>s</span>
      <span style="color:#ff6b7a">HP <span id="hp">100</span></span>
      <span style="color:#9fd6ff">KILLS <span id="kills">0</span></span>
    </div>
    <div id="overlay">
      <h2 id="ov-title"></h2>
      <div class="sub" id="ov-sub"></div>
      <div class="cards" id="ov-cards"></div>
      <button class="btn" id="ov-btn" style="display:none"></button>
    </div>
  </div>
  <div id="help">
    <kbd>WASD</kbd>/<kbd>arrows</kbd> move · you auto-fire at the nearest enemy ·
    survive the swarm, level up, get stronger
  </div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const $ = (id) => document.getElementById(id);
  const hud = { lvl:$("lvl"), time:$("time"), hp:$("hp"), kills:$("kills"), fill:$("lvlfill") };
  const overlay=$("overlay"), ovTitle=$("ov-title"), ovSub=$("ov-sub"), ovCards=$("ov-cards"), ovBtn=$("ov-btn");

  const rand=(a,b)=>a+Math.random()*(b-a);
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

  // ---- audio (tiny WebAudio synth — no asset files) ----
  let actx=null;
  function initAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function tone(freq,dur,type,vol,slide){
    if(!actx)return; const t=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }
  function noise(dur,vol){
    if(!actx)return; const t=actx.currentTime, n=Math.floor(actx.sampleRate*dur);
    const buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=actx.createBufferSource(); s.buffer=buf;
    const g=actx.createGain(); g.gain.value=vol||0.08;
    s.connect(g).connect(actx.destination); s.start();
  }
  const sfx={
    shoot:()=>tone(680,0.05,"square",0.025,-260),
    kill:()=>tone(320,0.11,"sawtooth",0.045,-180),
    hurt:()=>{noise(0.18,0.11);tone(120,0.18,"sawtooth",0.06,-50);},
    level:()=>{tone(523,0.09,"square",0.06);setTimeout(()=>tone(784,0.13,"square",0.06),85);},
    boss:()=>{tone(150,0.55,"sawtooth",0.09,-70);setTimeout(()=>tone(110,0.5,"sawtooth",0.08,-30),120);},
    bossdown:()=>{tone(440,0.1,"square",0.07);setTimeout(()=>tone(660,0.1,"square",0.07),90);setTimeout(()=>tone(880,0.2,"square",0.07),180);},
  };

  // ---- state ----
  let player, enemies, bullets, orbs, particles, keys;
  let time, kills, spawnTimer, paused, gameOver, shake, frame, lastTs;
  let nextBoss, bannerText, bannerT;

  function reset() {
    player = { x:W/2, y:H/2, r:11, hp:120, maxhp:120, speed:3.4,
               level:1, xp:0, xpNext:10, invuln:0,
               fireRate:14, fireCd:0, dmg:20, bulletSpeed:8.5, bullets:1, pierce:0, range:1e9,
               orbiters:0, orbA:0, orbPos:[], explosive:0 };
    enemies=[]; bullets=[]; orbs=[]; particles=[];
    keys={}; time=0; kills=0; spawnTimer=0; paused=false; gameOver=false;
    shake=0; frame=0; lastTs=performance.now();
    nextBoss=45; bannerText=""; bannerT=0;
    overlay.classList.remove("show"); ovBtn.style.display="none";
  }

  addEventListener("keydown",e=>{ initAudio(); keys[e.key.toLowerCase()]=true;
    if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault(); });
  addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });

  const down=(...k)=>k.some(x=>keys[x]);

  // ---- particles / juice ----
  function burst(x,y,color,n,spd=4){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), s=rand(.4,1)*spd;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(14,30),max:30,color,r:rand(1.5,3.5)});
    }
  }
  function addShake(n){ shake=Math.min(shake+n,16); }

  // ---- spawning ----
  function spawnEnemy(){
    const edge=Math.floor(rand(0,4));
    let x,y;
    if(edge===0){x=rand(0,W);y=-20;} else if(edge===1){x=W+20;y=rand(0,H);}
    else if(edge===2){x=rand(0,W);y=H+20;} else {x=-20;y=rand(0,H);}
    const tough=Math.min(time/30,4);
    const big=Math.random()<Math.min(0.08+time/600,0.25);
    enemies.push({
      x,y, r: big?20:11, hp: (big?60:14)+tough*8, maxhp:0,
      speed: big?0.8:rand(0.9,1.4), dmg: big?20:10, big,
      color: big?"#ff7b3a":"#ff5d6a", hit:0
    });
    enemies[enemies.length-1].maxhp=enemies[enemies.length-1].hp;
  }

  function spawnBoss(){
    const x=W/2, y=-60;
    const hp=420+time*7;
    enemies.push({ x,y, r:42, hp, maxhp:hp, speed:0.75, dmg:34, big:true, boss:true,
                   color:"#b06bff", hit:0 });
    sfx.boss(); bannerText="◆  B O S S  ◆"; bannerT=130; addShake(8);
  }

  // ---- leveling ----
  const UPGRADES=[
    {t:"+1 Projectile", d:"Fire an extra bullet each shot.", fn:p=>p.bullets++},
    {t:"Rapid Fire", d:"Shoot 25% faster.", fn:p=>p.fireRate=Math.max(5,p.fireRate*0.75)},
    {t:"Heavy Rounds", d:"+40% bullet damage.", fn:p=>p.dmg*=1.4},
    {t:"Piercing", d:"Bullets pass through +1 enemy.", fn:p=>p.pierce++},
    {t:"Swift Boots", d:"+18% move speed.", fn:p=>p.speed*=1.18},
    {t:"Vitality", d:"+30 max HP and heal 30.", fn:p=>{p.maxhp+=30;p.hp=Math.min(p.maxhp,p.hp+30);}},
    {t:"Velocity", d:"+30% bullet speed.", fn:p=>p.bulletSpeed*=1.3},
    {t:"Orbiting Blade", d:"A blade spins around you, shredding what it touches.", fn:p=>p.orbiters++},
    {t:"Explosive Rounds", d:"Kills detonate, damaging nearby enemies.", fn:p=>p.explosive++},
  ];
  function pick3(){
    const pool=[...UPGRADES]; const out=[];
    for(let i=0;i<3;i++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    return out;
  }
  function levelUp(){
    player.level++; player.xp-=player.xpNext; player.xpNext=Math.floor(player.xpNext*1.6+8);
    player.hp=Math.min(player.maxhp,player.hp+8);
    paused=true;
    const choices=pick3();
    ovTitle.textContent="LEVEL "+player.level; ovTitle.style.color="#8effc0";
    ovSub.textContent="Choose an upgrade";
    ovCards.innerHTML=""; ovBtn.style.display="none";
    choices.forEach(u=>{
      const el=document.createElement("div"); el.className="card";
      el.innerHTML=`<div class="t">${u.t}</div><div class="d">${u.d}</div>`;
      el.onclick=()=>{ u.fn(player); paused=false; overlay.classList.remove("show"); burst(player.x,player.y,"#8effc0",24,5); addShake(6); };
      ovCards.appendChild(el);
    });
    sfx.level();
    overlay.classList.add("show");
  }

  function die(){
    gameOver=true; paused=true;
    ovTitle.textContent="YOU DIED"; ovTitle.style.color="#ff6b7a";
    ovSub.textContent=`Survived ${Math.floor(time)}s · Level ${player.level} · ${kills} kills`;
    ovCards.innerHTML=""; ovBtn.style.display="inline-block"; ovBtn.textContent="RUN AGAIN";
    ovBtn.onclick=()=>{ reset(); };
    overlay.classList.add("show");
  }

  // ---- update ----
  function update(dt){
    if(paused||gameOver) return;
    frame++; time+=dt;

    // move
    let mx=(down("d","arrowright")-down("a","arrowleft"));
    let my=(down("s","arrowdown")-down("w","arrowup"));
    if(mx&&my){const inv=1/Math.sqrt(2);mx*=inv;my*=inv;}
    player.x=Math.max(player.r,Math.min(W-player.r,player.x+mx*player.speed));
    player.y=Math.max(player.r,Math.min(H-player.r,player.y+my*player.speed));

    // spawn ramp (gentler: starts slow, never gets insane)
    spawnTimer-=dt*60;
    const interval=Math.max(20,72-time*0.4);
    if(spawnTimer<=0){ spawnEnemy(); spawnTimer=interval; }

    // boss every 60s (first at 45s)
    if(time>=nextBoss){ spawnBoss(); nextBoss+=60; }
    if(bannerT>0) bannerT-=dt*60;

    if(player.invuln>0) player.invuln-=dt*60;

    // auto-fire at nearest
    player.fireCd-=dt*60;
    if(player.fireCd<=0&&enemies.length){
      let best=null,bd=1e18;
      for(const e of enemies){const d=dist2(player.x,player.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
      if(best){
        const base=Math.atan2(best.y-player.y,best.x-player.x);
        const spread=0.16;
        for(let i=0;i<player.bullets;i++){
          const off=(i-(player.bullets-1)/2)*spread;
          const a=base+off;
          bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*player.bulletSpeed,vy:Math.sin(a)*player.bulletSpeed,r:4,dmg:player.dmg,pierce:player.pierce,hits:[]});
        }
        player.fireCd=player.fireRate; sfx.shoot();
      }
    }

    // orbiting blades — shred enemies they touch
    player.orbPos=[];
    if(player.orbiters>0){
      player.orbA+=dt*0.12;
      const radius=46, bladeR=10, bladeDmg=55*dt;
      for(let i=0;i<player.orbiters;i++){
        const a=player.orbA + i*(Math.PI*2/player.orbiters);
        const bx=player.x+Math.cos(a)*radius, by=player.y+Math.sin(a)*radius;
        player.orbPos.push({x:bx,y:by});
        for(const e of enemies){
          const rr=bladeR+e.r;
          if(dist2(bx,by,e.x,e.y)<rr*rr){
            e.hp-=bladeDmg; e.hit=4;
            if(frame%4===0) burst(bx,by,"#cfa8ff",2,2);
          }
        }
      }
    }

    // bullets
    for(const b of bullets){ b.x+=b.vx; b.y+=b.vy; }
    bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);

    // enemies move toward player
    let touchDmg=0;
    for(const e of enemies){
      const a=Math.atan2(player.y-e.y,player.x-e.x);
      e.x+=Math.cos(a)*e.speed; e.y+=Math.sin(a)*e.speed;
      if(e.hit>0)e.hit--;
      // contact: remember the hardest-hitting toucher this frame
      const rr=(e.r+player.r);
      if(dist2(e.x,e.y,player.x,player.y)<rr*rr) touchDmg=Math.max(touchDmg,e.dmg);
    }
    // take one hit per i-frame window, not per-enemy-per-frame
    if(touchDmg>0 && player.invuln<=0){
      player.hp-=touchDmg; player.invuln=45; addShake(5);
      burst(player.x,player.y,"#ff6b7a",8,4); sfx.hurt();
    }
    if(player.hp<=0){ player.hp=0; burst(player.x,player.y,"#ff6b7a",40,6); addShake(14); die(); return; }

    // bullet vs enemy
    for(const b of bullets){
      for(const e of enemies){
        if(b.hits.includes(e))continue;
        const rr=b.r+e.r;
        if(dist2(b.x,b.y,e.x,e.y)<rr*rr){
          e.hp-=b.dmg; e.hit=6; b.hits.push(e);
          burst(b.x,b.y,e.color,5,3); addShake(1);
          // knockback
          const a=Math.atan2(e.y-player.y,e.x-player.x);
          e.x+=Math.cos(a)*4; e.y+=Math.sin(a)*4;
          if(b.pierce-->0){}else{ b.dead=true; }
          break;
        }
      }
    }

    // resolve deaths (covers bullets, blades, explosions)
    function killReward(e){
      kills++;
      burst(e.x,e.y,e.color,e.boss?60:e.big?28:12,e.boss?8:e.big?6:4);
      addShake(e.boss?14:e.big?6:2); sfx.kill();
      if(e.boss){
        for(let i=0;i<14;i++) orbs.push({x:e.x+rand(-34,34),y:e.y+rand(-34,34),r:4,v:5});
        player.hp=Math.min(player.maxhp,player.hp+30);
        bannerText="BOSS DOWN"; bannerT=100; sfx.bossdown();
      } else {
        orbs.push({x:e.x,y:e.y,r:4,v:e.big?5:1});
      }
      // explosive rounds: detonate, hurting nearby enemies
      if(player.explosive>0){
        const R=50+player.explosive*16, dmg=40+player.explosive*20;
        burst(e.x,e.y,"#ffb24a",18,6);
        for(const o of enemies){ if(o!==e && !o.dead && dist2(o.x,o.y,e.x,e.y)<R*R){ o.hp-=dmg; o.hit=6; } }
      }
    }
    for(const e of enemies){ if(!e.dead && e.hp<=0){ e.dead=true; killReward(e); } }

    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);

    // orbs magnet + pickup
    for(const o of orbs){
      const d=dist2(o.x,o.y,player.x,player.y);
      if(d<120*120){ const a=Math.atan2(player.y-o.y,player.x-o.x); const pull=Math.min(7,9000/(Math.sqrt(d)+1)); o.x+=Math.cos(a)*pull; o.y+=Math.sin(a)*pull; }
      if(d<(player.r+8)*(player.r+8)){ o.dead=true; player.xp+=o.v; burst(o.x,o.y,"#5ad1ff",4,2); }
    }
    orbs=orbs.filter(o=>!o.dead);
    while(player.xp>=player.xpNext){ levelUp(); }

    // particles
    for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life--; }
    particles=particles.filter(p=>p.life>0);

    if(shake>0)shake*=0.85;
  }

  // ---- render ----
  function render(){
    ctx.save();
    const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
    ctx.translate(sx,sy);
    ctx.clearRect(-20,-20,W+40,H+40);
    // bg grid
    ctx.fillStyle="#05050a"; ctx.fillRect(-20,-20,W+40,H+40);
    ctx.strokeStyle="#0d1018"; ctx.lineWidth=1;
    for(let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // orbs
    for(const o of orbs){ ctx.fillStyle="#5ad1ff"; ctx.shadowColor="#5ad1ff"; ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill(); }
    ctx.shadowBlur=0;

    // enemies
    for(const e of enemies){
      ctx.fillStyle=e.hit>0?"#ffffff":e.color;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
      // hp ring for big
      if(e.big){ ctx.strokeStyle="#ffd25a"; ctx.lineWidth=2; ctx.beginPath();
        ctx.arc(e.x,e.y,e.r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*(e.hp/e.maxhp)); ctx.stroke(); }
    }

    // bullets
    ctx.fillStyle="#fff3b0"; ctx.shadowColor="#ffd25a"; ctx.shadowBlur=8;
    for(const b of bullets){ ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill(); }
    ctx.shadowBlur=0;

    // particles
    for(const p of particles){ ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill(); }
    ctx.globalAlpha=1;

    // orbiting blades
    if(!gameOver) for(const p of player.orbPos){
      ctx.fillStyle="#cfa8ff"; ctx.shadowColor="#b06bff"; ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);ctx.fill();
      ctx.shadowBlur=0;
    }

    // player (blinks while invulnerable)
    if(!gameOver && !(player.invuln>0 && Math.floor(player.invuln/6)%2)){
      ctx.fillStyle="#8effc0"; ctx.shadowColor="#8effc0"; ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();

    // --- screen-space UI (no shake) ---
    // boss health bar
    const boss=enemies.find(e=>e.boss);
    if(boss){
      const bw=W*0.6, bx=(W-bw)/2, by=H-22;
      ctx.fillStyle="#1a0f24"; ctx.fillRect(bx,by,bw,10);
      ctx.fillStyle="#b06bff"; ctx.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.maxhp),10);
      ctx.strokeStyle="#7a4fc0"; ctx.strokeRect(bx+.5,by+.5,bw-1,9);
      ctx.fillStyle="#cfa8ff"; ctx.font="10px monospace"; ctx.textAlign="center";
      ctx.fillText("BOSS", W/2, by-4);
    }
    // banner
    if(bannerT>0){
      ctx.globalAlpha=Math.min(1,bannerT/30);
      ctx.fillStyle="#cfa8ff"; ctx.font="700 28px monospace"; ctx.textAlign="center";
      ctx.fillText(bannerText, W/2, H*0.32);
      ctx.globalAlpha=1;
    }
  }

  function syncHud(){
    hud.lvl.textContent=player.level;
    hud.time.textContent=Math.floor(time);
    hud.hp.textContent=Math.ceil(player.hp);
    hud.kills.textContent=kills;
    hud.fill.style.width=(100*player.xp/player.xpNext)+"%";
  }

  function loop(ts){
    const dt=Math.min((ts-lastTs)/16.67,2.5); lastTs=ts;
    update(dt); render(); syncHud();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

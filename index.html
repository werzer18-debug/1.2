<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SWARM — juicy survival</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #07070d; color: #d7d7e0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; user-select: none; overflow: hidden;
  }
  h1 { margin: 0; font-size: 16px; letter-spacing: 4px; color: #9fd6ff; font-weight: 700; }
  #wrap { position: relative; max-width: 100%; }
  canvas {
    background: #05050a; border: 1px solid #1c2030; border-radius: 8px;
    box-shadow: 0 12px 50px rgba(0,0,0,.7); display: block;
    max-width: 100%; height: auto; touch-action: none;
  }
  #hud {
    position: absolute; top: 10px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; pointer-events: none;
    font-size: 13px; text-shadow: 0 1px 3px #000;
  }
  #hud .grp { display: flex; gap: 14px; }
  #lvlbar {
    position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: #14182a;
  }
  #lvlfill { height: 100%; width: 0%; background: linear-gradient(90deg,#5ad1ff,#8effc0); transition: width .08s; }
  #help { font-size: 12px; color: #6f6f8a; }
  #help kbd { background:#16182a;border:1px solid #2a2e44;border-radius:4px;padding:1px 6px;color:#cfcfe6; }
  #overlay {
    position:absolute; inset:0; display:none; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; background:rgba(5,5,10,.85);
    border-radius:8px; text-align:center;
  }
  #overlay.show { display:flex; }
  #overlay h2 { margin:0; font-size:30px; letter-spacing:3px; }
  #overlay .sub { color:#9a9ab4; font-size:13px; }
  .cards { display:flex; gap:12px; margin-top:6px; }
  .card {
    pointer-events:auto; cursor:pointer; width:150px; padding:14px 12px;
    background:#11142400; border:1px solid #2a3050; border-radius:8px;
    background:#0d1020; transition:.12s; text-align:left;
  }
  .card:hover { border-color:#5ad1ff; transform:translateY(-3px); background:#121734; }
  .card .t { color:#9fd6ff; font-size:14px; font-weight:700; margin-bottom:4px; }
  .card .d { color:#8a8aa6; font-size:11px; line-height:1.5; }
  .card .lv { margin-top:7px; font-size:12px; color:#ffd25a; letter-spacing:1px; }
  .card .lv .nx { color:#6f6f8a; letter-spacing:0; }
  .card .lv.new { color:#8effc0; font-weight:700; }
  .btn {
    pointer-events:auto; cursor:pointer; margin-top:6px; padding:8px 18px;
    background:#1a2140; border:1px solid #3a4570;
    border-radius:6px; color:#cfe6ff; font-family:inherit; font-size:13px;
  }
  .btn:hover { background:#243066; }
</style>
</head>
<body>
  <h1>S W A R M</h1>
  <div id="wrap">
    <canvas id="game" width="720" height="520"></canvas>
    <div id="lvlbar"><div id="lvlfill"></div></div>
    <div id="hud">
      <span class="grp"><span style="color:#8effc0">LVL <span id="lvl">1</span></span><span style="color:#ffd25a">TIME <span id="time">0</span>s</span></span>
      <span class="grp"><span style="color:#ff6b7a">HP <span id="hp">100</span></span><span style="color:#9fd6ff">KILLS <span id="kills">0</span></span></span>
    </div>
    <div id="overlay">
      <h2 id="ov-title"></h2>
      <div class="sub" id="ov-sub"></div>
      <div class="cards" id="ov-cards"></div>
      <button class="btn" id="ov-btn" style="display:none"></button>
    </div>
  </div>
  <div id="help">
    <kbd>WASD</kbd>/<kbd>arrows</kbd> move · auto-fire at nearest ·
    <b>mobile:</b> left half = move, right half = aim (else auto-aim)
  </div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("game"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;        // viewport size
  const WORLD_W = 1500, WORLD_H = 1100;     // explorable world (bigger than the viewport)
  const cam = {x:0, y:0};                   // camera top-left, in world space
  const $ = (id) => document.getElementById(id);
  const hud = { lvl:$("lvl"), time:$("time"), hp:$("hp"), kills:$("kills"), fill:$("lvlfill") };
  const overlay=$("overlay"), ovTitle=$("ov-title"), ovSub=$("ov-sub"), ovCards=$("ov-cards"), ovBtn=$("ov-btn");

  const rand=(a,b)=>a+Math.random()*(b-a);
  const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
  const fmt=(s)=>{ s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60); return m>0?(m+":"+String(s%60).padStart(2,"0")):(s+"s"); };
  const XP_MULT=1.581;                 // base XP gain bonus (+15%, +10%, then +25%)

  // ---- audio (tiny WebAudio synth — no asset files) ----
  let actx=null;
  function initAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(actx && actx.state==="suspended") actx.resume();
  }
  function tone(freq,dur,type,vol,slide){
    if(!actx)return; const t=actx.currentTime;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }
  function noise(dur,vol){
    if(!actx)return; const t=actx.currentTime, n=Math.floor(actx.sampleRate*dur);
    const buf=actx.createBuffer(1,n,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=actx.createBufferSource(); s.buffer=buf;
    const g=actx.createGain(); g.gain.value=vol||0.08;
    s.connect(g).connect(actx.destination); s.start();
  }
  const sfx={
    shoot:()=>tone(680,0.05,"square",0.025,-260),
    kill:()=>tone(320,0.11,"sawtooth",0.045,-180),
    hurt:()=>{noise(0.18,0.11);tone(120,0.18,"sawtooth",0.06,-50);},
    level:()=>{tone(523,0.09,"square",0.06);setTimeout(()=>tone(784,0.13,"square",0.06),85);},
    boss:()=>{tone(150,0.55,"sawtooth",0.09,-70);setTimeout(()=>tone(110,0.5,"sawtooth",0.08,-30),120);},
    bossdown:()=>{tone(440,0.1,"square",0.07);setTimeout(()=>tone(660,0.1,"square",0.07),90);setTimeout(()=>tone(880,0.2,"square",0.07),180);},
  };

  // ---- state ----
  let player, enemies, bullets, orbs, particles, drops, eBullets, novas, keys;
  let time, kills, spawnTimer, paused, gameOver, shake, frame, lastTs, acc;
  let wave, waveStart, wavePhase, nextMini, miniCount, bannerText, bannerT, spawnTimerBig;

  function reset() {
    player = { x:WORLD_W/2, y:WORLD_H/2, r:11, hp:100, maxhp:100, speed:3.4,
               level:1, xp:0, xpNext:10, invuln:0,
               fireRate:15, fireCd:0, dmg:80, bulletSpeed:8.5, bullets:1, pierce:0, range:1e9,
               orbiters:0, orbA:0, orbPos:[], explosive:0,
               nova:0, novaCd:0, lifesteal:0 };
    enemies=[]; bullets=[]; orbs=[]; particles=[]; drops=[]; eBullets=[]; novas=[];
    keys={}; time=0; kills=0; spawnTimer=0; paused=false; gameOver=false;
    shake=0; frame=0; lastTs=performance.now(); acc=0;
    bannerText=""; bannerT=0; miniCount=0;
    wave=1; startWave();            // kick off Wave 1
    UPGRADES.forEach(u=>u.lvl=0);   // reset upgrade stars each run
    overlay.classList.remove("show"); ovBtn.style.display="none";
  }

  addEventListener("click", initAudio);
  addEventListener("touchstart", initAudio);
  addEventListener("keydown",e=>{ initAudio(); keys[e.key.toLowerCase()]=true;
    if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault(); });
  addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });

  const down=(...k)=>k.some(x=>keys[x]);

  // ---- touch controls (TEMP mobile layer): left half = move stick, right half = aim stick.
  // aim stick steers manual fire; if it's not held, auto-aim at nearest takes over.
  const STICK_R=55;
  const moveStick={id:null,ox:0,oy:0,cx:0,cy:0,nx:0,ny:0,active:false};
  const aimStick ={id:null,ox:0,oy:0,cx:0,cy:0,angle:0,mag:0,active:false};
  function canvasPt(t){
    const rect=cv.getBoundingClientRect();
    return { x:(t.clientX-rect.left)*(cv.width/rect.width),
             y:(t.clientY-rect.top )*(cv.height/rect.height) };
  }
  function touchStart(e){
    initAudio();
    for(const t of e.changedTouches){
      const p=canvasPt(t);
      if(p.x<W/2 && !moveStick.active){
        moveStick.id=t.identifier; moveStick.ox=moveStick.cx=p.x; moveStick.oy=moveStick.cy=p.y;
        moveStick.nx=0; moveStick.ny=0; moveStick.active=true;
      } else if(p.x>=W/2 && !aimStick.active){
        aimStick.id=t.identifier; aimStick.ox=aimStick.cx=p.x; aimStick.oy=aimStick.cy=p.y;
        aimStick.mag=0; aimStick.active=true;
      }
    }
    e.preventDefault();
  }
  function touchMove(e){
    for(const t of e.changedTouches){
      const p=canvasPt(t);
      if(t.identifier===moveStick.id){
        const dx=p.x-moveStick.ox, dy=p.y-moveStick.oy, m=Math.hypot(dx,dy)||1, cl=Math.min(m,STICK_R);
        moveStick.nx=(dx/m)*(cl/STICK_R); moveStick.ny=(dy/m)*(cl/STICK_R);
        moveStick.cx=moveStick.ox+(dx/m)*cl; moveStick.cy=moveStick.oy+(dy/m)*cl;
      } else if(t.identifier===aimStick.id){
        const dx=p.x-aimStick.ox, dy=p.y-aimStick.oy, m=Math.hypot(dx,dy), cl=Math.min(m,STICK_R);
        aimStick.angle=Math.atan2(dy,dx); aimStick.mag=Math.min(m/STICK_R,1);
        aimStick.cx=aimStick.ox+Math.cos(aimStick.angle)*cl; aimStick.cy=aimStick.oy+Math.sin(aimStick.angle)*cl;
      }
    }
    e.preventDefault();
  }
  function touchEnd(e){
    for(const t of e.changedTouches){
      if(t.identifier===moveStick.id){ moveStick.active=false; moveStick.id=null; moveStick.nx=0; moveStick.ny=0; }
      if(t.identifier===aimStick.id){ aimStick.active=false; aimStick.id=null; aimStick.mag=0; }
    }
    e.preventDefault();
  }
  cv.addEventListener("touchstart",touchStart,{passive:false});
  cv.addEventListener("touchmove",touchMove,{passive:false});
  cv.addEventListener("touchend",touchEnd,{passive:false});
  cv.addEventListener("touchcancel",touchEnd,{passive:false});

  // ---- particles / juice ----
  function burst(x,y,color,n,spd=4){
    for(let i=0;i<n;i++){
      const a=rand(0,Math.PI*2), s=rand(.4,1)*spd;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(14,30),max:30,color,r:rand(1.5,3.5)});
    }
  }
  function addShake(n){ shake=Math.min(shake+n*0.5,9); }

  // ---- spawning ----
  function edgePos(pad){            // a random point just off the visible viewport edge
    const e=Math.floor(rand(0,4));
    const L=cam.x, T=cam.y, R=cam.x+W, B=cam.y+H;
    if(e===0) return {x:rand(L,R), y:T-pad};
    if(e===1) return {x:R+pad,     y:rand(T,B)};
    if(e===2) return {x:rand(L,R), y:B+pad};
    return {x:L-pad, y:rand(T,B)};
  }

  // reusable progressive scaler: base grown `factor` per step (minibosses, waves, bosses…)
  function progressive(base, factor, step){ return base * Math.pow(factor, step); }

  // outward knockback that respects per-type immunity (minibosses & bosses never move)
  function applyKnockback(e, fromX, fromY, force){
    if(e.mini || e.boss || force<=0) return;       // immune
    const a=Math.atan2(e.y-fromY, e.x-fromX);
    e.x+=Math.cos(a)*force; e.y+=Math.sin(a)*force;
  }

  // a normal mob (small, or big when big=true). HP x1.5 vs old baseline.
  function spawnEnemy(big){
    const p=edgePos(20);
    const secs=time/60;
    const hpScale=Math.min(secs*0.12, 45);   // slow growth across full 6-min run
    const dmgScale=Math.min(secs*0.012, 8); // very slow damage growth
    const hp=((big?81:20)+hpScale*(big?3:1))*1.5;
    enemies.push({
      x:p.x, y:p.y, r: big?20:11,
      hp, maxhp:hp,
      speed: big?0.8:rand(0.9,1.4),
      dmg: (big?20:10)+dmgScale*(big?1.5:1), big,
      color: big?"#ff7b3a":"#ff5d6a", hit:0
    });
  }

  // boss HP for the current wave at the current moment
  function currentBossHp(){
    const cfg=WAVES[wave], elapsed=(time-waveStart)/60;
    return cfg ? cfg.bossHp(elapsed) : Math.floor((1200+(time/60)*36)*5);
  }

  // miniboss: each spawn is progressively stronger than the last (HP + damage).
  // immune to knockback; uses a telegraphed Charge ability.
  function spawnMiniboss(){
    const p=edgePos(30);
    miniCount++;
    const hp=Math.floor(progressive(7000, 1.1, miniCount-1));    // +10% per spawn
    const dmg=Math.floor(progressive(14, 1.1, miniCount-1));     // +10% per spawn
    enemies.push({ x:p.x, y:p.y, r:38, hp, maxhp:hp, speed:0.95, dmg,
                   big:true, mini:true, color:"#ff5ec4", hit:0,
                   abCd:5, tele:0, teleMax:0, teleKind:null, charge:null });
    sfx.boss(); bannerText="MINIBOSS "+miniCount; bannerT=80; addShake(5);
  }

  // wave boss: clears all NORMAL mobs (keeps minibosses) then arrives.
  // immune to knockback; uses two telegraphed abilities (Bullet Ring + Slam).
  function spawnBoss(){
    enemies=enemies.filter(e=>e.mini||e.boss);   // keep minibosses, drop normals
    const hp=currentBossHp();
    enemies.push({ x:cam.x+W/2, y:cam.y-60, r:42, hp, maxhp:hp, speed:0.78, dmg:34,
                   big:true, boss:true, color:"#b06bff", hit:0,
                   abCd:6, tele:0, teleMax:0, teleKind:null, abToggle:0 });
    sfx.boss(); bannerText="◆  B O S S  ◆"; bannerT=140; addShake(8);
  }

  // ---- enemy abilities (telegraphed) ----
  // timers here are in seconds; decrement by dt (1 unit ≈ 1 frame, 60 ≈ 1s) /60.
  function updateEnemyAbility(e, dt){
    if(e.tele>0){                              // currently telegraphing
      e.tele-=dt/60;
      if(e.tele<=0) fireEnemyAbility(e);
      return;
    }
    e.abCd-=dt/60;
    if(e.abCd<=0){
      if(e.boss){ e.teleKind=(e.abToggle++%2===0)?"ring":"slam"; }
      else { e.teleKind="charge"; }
      e.tele=1.1; e.teleMax=1.1;              // ~1.1s telegraph
      if(e.teleKind==="slam") e.slamTarget={x:player.x,y:player.y,R:95};
      if(e.teleKind==="charge") e.chargeAim={x:player.x,y:player.y};
    }
  }
  function fireEnemyAbility(e){
    const kind=e.teleKind; e.teleKind=null; e.tele=0;
    if(kind==="ring"){                         // boss: radial bullet burst
      const n=22, spd=3.0;
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2;
        eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:6,dmg:16,life:4}); }
      addShake(6); sfx.boss(); e.abCd=7;
    } else if(kind==="slam"){                  // boss: ground slam at telegraphed spot
      const tg=e.slamTarget||{x:player.x,y:player.y,R:95};
      burst(tg.x,tg.y,"#ff6b7a",34,7); addShake(9);
      if(dist2(player.x,player.y,tg.x,tg.y)<tg.R*tg.R && player.invuln<=0){
        player.hp-=30; player.invuln=45; sfx.hurt();
      }
      e.abCd=7;
    } else if(kind==="charge"){                // miniboss: lunge toward telegraphed point
      const tg=e.chargeAim||{x:player.x,y:player.y};
      const a=Math.atan2(tg.y-e.y, tg.x-e.x), dashSpeed=4.5;
      e.charge={vx:Math.cos(a)*dashSpeed, vy:Math.sin(a)*dashSpeed, t:16};
      addShake(4); e.abCd=6;
    }
  }

  // ---- wave system (modular: each wave is a self-contained config) ----
  const TOTAL_WAVES=3;
  function makeWave(opts){
    return Object.assign({
      minDuration: 330,                                       // boss at 5.5 min
      // roguelite ramp: a slow trickle for the first 2s, then steadily denser over the run.
      // (frames between spawns; 60 = 1s) lower = faster.
      // staged early ramp (steps at 3/5/10/15/20s), then a slow continuous climb.
      // (frames between spawns; 60 = 1s) lower = faster.
      // stretched over 360s: slow warmup → gradual climb → peaks near end
      spawnInterval: (s)=>{
        let iv;
        if(s<15)       iv=190;   // 0-15s:   ~1.0/s
        else if(s<40)  iv=120;   // 15-40s:  ~1.6/s
        else if(s<90)  iv=80;    // 40-90s:  ~2.4/s
        else if(s<180) iv=55;    // 90-180s: ~3.5/s
        else if(s<270) iv=38;    // 180-270s:~5.1/s
        else iv=Math.max(22, 38-(s-270)*0.10); // 270s+: up to ~8.7/s
        return iv/3.2;
      },
      // big mobs join at 60s, step up every 15s, cap at 3/s around 5 min
      bigSpawnInterval: (s)=>{
        if(s<60) return Infinity;
        const steps=Math.floor((s-60)/15);
        return Math.max(20, 60 - steps*3.0);
      },
      miniGap:       [120,120],                               // mini 1 at 2 min, mini 2 at 4 min
      bossHp:        ()=> 15000,
    }, opts);
  }
  const WAVES = {
    1: makeWave({}),                                          // Wave 1 — fully defined
    // Placeholders — fill in real content later WITHOUT touching Wave 1:
    2: makeWave({ bossHp:()=>19000 }),
    3: makeWave({ bossHp:()=>24000 }),
  };

  function startWave(){
    const cfg=WAVES[wave]; if(!cfg) return;
    waveStart=time; wavePhase="fight"; spawnTimer=0; spawnTimerBig=0;
    // schedule against real-time `time` (60 units = 1 real second)
    nextMini=time+rand(cfg.miniGap[0],cfg.miniGap[1])*60;
  }

  function updateWave(dt){
    const cfg=WAVES[wave]; if(!cfg) return;        // all waves cleared -> idle
    const elapsed=(time-waveStart)/60;
    if(wavePhase==="fight"){
      // mobs: small at first, big mixed in as the wave progresses
      // (spawnInterval is in frames: 60 = 1s, so tick by dt — NOT dt*60)
      spawnTimer-=dt;
      if(spawnTimer<=0){ spawnEnemy(false); spawnTimer=cfg.spawnInterval(elapsed); }
      // big mobs on their own staged cadence, capped by concurrent count
      spawnTimerBig-=dt;
      if(spawnTimerBig<=0){
        const bi=cfg.bigSpawnInterval(elapsed);
        if(isFinite(bi)){ spawnEnemy(true); spawnTimerBig=bi; }   // uncapped
        else spawnTimerBig=30;   // recheck soon until big mobs unlock
      }
      // minibosses every random 50-80 REAL seconds, can stack
      if(time>=nextMini){ spawnMiniboss(); nextMini=time+rand(cfg.miniGap[0],cfg.miniGap[1])*60; }
      // boss after the minimum wave duration
      if(elapsed>=cfg.minDuration){ spawnBoss(); wavePhase="boss"; }
    } else if(wavePhase==="boss"){
      // no new spawns; wave clears when the boss is defeated
      if(!enemies.some(e=>e.boss)){
        wavePhase="done";
        wave++;
        if(WAVES[wave]){ bannerText="WAVE "+(wave-1)+" CLEARED"; bannerT=150; startWave(); }
        else { bannerText="ALL WAVES CLEARED!"; bannerT=300; }
      }
    }
  }

  // ---- leveling ----
  const UPGRADES=[
    {t:"+1 Projectile", lvl:0, d:"Fire an extra bullet each shot.", fn:p=>p.bullets++},
    {t:"Rapid Fire", lvl:0, d:"Shoot 25% faster.", fn:p=>p.fireRate=Math.max(5,p.fireRate*0.75)},
    {t:"Heavy Rounds", lvl:0, d:"+40% bullet damage.", fn:p=>p.dmg*=1.4},
    {t:"Piercing", lvl:0, d:"Bullets pass through +1 enemy.", fn:p=>p.pierce++},
    {t:"Swift Boots", lvl:0, d:"+18% move speed.", fn:p=>p.speed*=1.18},
    {t:"Vitality", lvl:0, d:"+30 max HP and heal 30.", fn:p=>{p.maxhp+=30;p.hp=Math.min(p.maxhp,p.hp+30);}},
    {t:"Velocity", lvl:0, d:"+30% bullet speed.", fn:p=>p.bulletSpeed*=1.3},
    {t:"Orbiting Blade", lvl:0, d:"A blade spins around you, shredding what it touches.", fn:p=>p.orbiters++},
    {t:"Explosive Rounds", lvl:0, d:"Kills detonate, damaging nearby enemies.", fn:p=>p.explosive++},
    {t:"Shock Nova", lvl:0, d:"Periodically blast a ring of energy around you.", fn:p=>p.nova++},
    {t:"Life Leech", lvl:0, d:"Heal a tiny amount with every kill.", fn:p=>p.lifesteal++},
  ];
  // stars showing how many times an upgrade has already been taken
  function lvlTag(u){
    if(u.lvl<=0) return `<div class="lv new">◇ NEW</div>`;
    const stars = "★".repeat(Math.min(u.lvl,6)) + (u.lvl>6 ? " ×"+u.lvl : "");
    return `<div class="lv">${stars} <span class="nx">→ Lv ${u.lvl+1}</span></div>`;
  }
  function pick3(){
    const pool=[...UPGRADES]; const out=[];
    for(let i=0;i<3;i++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    return out;
  }
  function showUpgradeChoice(title,sub,titleColor){
    paused=true;
    const choices=pick3();
    ovTitle.textContent=title; ovTitle.style.color=titleColor||"#8effc0";
    ovSub.textContent=sub;
    ovCards.innerHTML=""; ovBtn.style.display="none";
    choices.forEach(u=>{
      const el=document.createElement("div"); el.className="card";
      el.innerHTML=`<div class="t">${u.t}</div><div class="d">${u.d}</div>${lvlTag(u)}`;
      el.onclick=()=>{ u.fn(player); u.lvl++; paused=false; overlay.classList.remove("show"); burst(player.x,player.y,"#8effc0",24,5); addShake(6); };
      ovCards.appendChild(el);
    });
    sfx.level();
    overlay.classList.add("show");
  }
  function levelUp(){
    player.level++; player.xp-=player.xpNext; player.xpNext=Math.floor(player.xpNext*1.65+8);
    player.hp=Math.min(player.maxhp,player.hp+8);
    showUpgradeChoice("LEVEL "+player.level, "Choose an upgrade");
  }

  function die(){
    gameOver=true; paused=true;
    ovTitle.textContent="YOU DIED"; ovTitle.style.color="#ff6b7a";
    ovSub.textContent=`Survived ${Math.floor(time/60)}s · Level ${player.level} · ${kills} kills`;
    ovCards.innerHTML=""; ovBtn.style.display="inline-block"; ovBtn.textContent="RUN AGAIN";
    ovBtn.onclick=()=>{ reset(); };
    overlay.classList.add("show");
  }

  // ---- update ----
  function update(dt){
    if(paused||gameOver) return;
    frame++; time+=dt;

    // move
    let mx=(down("d","arrowright")-down("a","arrowleft"));
    let my=(down("s","arrowdown")-down("w","arrowup"));
    if(mx&&my){const inv=1/Math.sqrt(2);mx*=inv;my*=inv;}
    if(moveStick.active){ mx=moveStick.nx; my=moveStick.ny; }  // touch overrides keyboard
    player.x=Math.max(player.r,Math.min(WORLD_W-player.r,player.x+mx*player.speed));
    player.y=Math.max(player.r,Math.min(WORLD_H-player.r,player.y+my*player.speed));
    // camera follows the player, clamped to the world
    cam.x=Math.max(0,Math.min(WORLD_W-W, player.x-W/2));
    cam.y=Math.max(0,Math.min(WORLD_H-H, player.y-H/2));

    // wave system drives all spawning (mobs, minibosses, boss)
    updateWave(dt);
    if(bannerT>0) bannerT-=dt*60;

    if(player.invuln>0) player.invuln-=dt*60;

    // auto-fire at nearest (fireRate is in frames: 60 = 1s, so tick by dt)
    player.fireCd-=dt;
    if(player.fireCd<=0){
      let base=null;
      if(aimStick.active && aimStick.mag>0.2){
        base=aimStick.angle;                       // manual aim
      } else if(enemies.length){
        let best=null,bd=1e18;
        for(const e of enemies){const d=dist2(player.x,player.y,e.x,e.y);if(d<bd){bd=d;best=e;}}
        if(best) base=Math.atan2(best.y-player.y,best.x-player.x);  // auto-aim
      }
      if(base!==null){
        const spread=0.16;
        for(let i=0;i<player.bullets;i++){
          const off=(i-(player.bullets-1)/2)*spread;
          const a=base+off;
          bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*player.bulletSpeed,vy:Math.sin(a)*player.bulletSpeed,r:4,dmg:player.dmg,pierce:player.pierce,hits:[]});
        }
        player.fireCd=player.fireRate; sfx.shoot();
      }
    }

    // orbiting blades — shred enemies they touch
    player.orbPos=[];
    if(player.orbiters>0){
      player.orbA+=dt*0.12;
      const radius=46, bladeR=10, bladeDmg=10*dt;
      for(let i=0;i<player.orbiters;i++){
        const a=player.orbA + i*(Math.PI*2/player.orbiters);
        const bx=player.x+Math.cos(a)*radius, by=player.y+Math.sin(a)*radius;
        player.orbPos.push({x:bx,y:by});
        for(const e of enemies){
          const rr=bladeR+e.r;
          if(dist2(bx,by,e.x,e.y)<rr*rr){
            e.hp-=bladeDmg; e.hit=4;
            // Orbit Power crowd-control: small mobs low push, big less, mini/boss immune.
            // force stays below approach speed so survivors can gradually close in.
            applyKnockback(e, player.x, player.y, e.big?0.35:1.1);
            if(frame%4===0) burst(bx,by,"#cfa8ff",2,2);
          }
        }
      }
    }

    // Shock Nova — periodic damaging ring around the player
    if(player.nova>0){
      player.novaCd-=dt/60;
      if(player.novaCd<=0){
        player.novaCd=4;                                  // every 4s
        const R=110+player.nova*25, dmg=28+player.nova*18;
        novas.push({x:player.x,y:player.y,max:R,r:0,life:0.35,maxlife:0.35});
        for(const e of enemies){ if(dist2(e.x,e.y,player.x,player.y)<R*R){
          e.hp-=dmg; e.hit=5; applyKnockback(e,player.x,player.y,e.big?0.5:1.4); } }
        addShake(4); tone(280,0.22,"sine",0.05,360);
      }
    }

    // bullets
    for(const b of bullets){ b.x+=b.vx; b.y+=b.vy; }
    bullets=bullets.filter(b=>b.x>-40&&b.x<WORLD_W+40&&b.y>-40&&b.y<WORLD_H+40);

    // enemy bullets (boss bullet-ring); damage player on contact
    for(const b of eBullets){
      b.x+=b.vx; b.y+=b.vy; b.life-=dt/60;
      if(player.invuln<=0 && dist2(b.x,b.y,player.x,player.y)<(b.r+player.r)*(b.r+player.r)){
        player.hp-=b.dmg; player.invuln=45; addShake(5); burst(player.x,player.y,"#ff8ad1",10,4); sfx.hurt(); b.dead=true;
      }
    }
    eBullets=eBullets.filter(b=>!b.dead && b.life>0 && b.x>-40&&b.x<WORLD_W+40&&b.y>-40&&b.y<WORLD_H+40);
    novas.forEach(nv=>{ nv.life-=dt/60; nv.r=nv.max*(1-Math.max(0,nv.life)/nv.maxlife); });
    novas=novas.filter(nv=>nv.life>0);
    if(player.hp<=0){ player.hp=0; burst(player.x,player.y,"#ff6b7a",40,6); addShake(14); die(); return; }

    // enemies: abilities (mini/boss), movement (charge or chase), contact
    let touchDmg=0;
    for(const e of enemies){
      if(e.mini||e.boss) updateEnemyAbility(e,dt);
      if(e.charge){                                   // miniboss lunging
        e.x+=e.charge.vx; e.y+=e.charge.vy;
        e.charge.t-=dt; if(e.charge.t<=0) e.charge=null;
      } else {
        const mv = e.tele>0 ? e.speed*0.25 : e.speed; // slow while winding up an ability
        const a=Math.atan2(player.y-e.y,player.x-e.x);
        e.x+=Math.cos(a)*mv; e.y+=Math.sin(a)*mv;
      }
      if(e.hit>0)e.hit--;
      // contact: remember the hardest-hitting toucher this frame
      const rr=(e.r+player.r);
      if(dist2(e.x,e.y,player.x,player.y)<rr*rr) touchDmg=Math.max(touchDmg,e.dmg);
    }
    // take one hit per i-frame window, not per-enemy-per-frame
    if(touchDmg>0 && player.invuln<=0){
      player.hp-=touchDmg; player.invuln=45; addShake(5);
      burst(player.x,player.y,"#ff6b7a",8,4); sfx.hurt();
    }
    if(player.hp<=0){ player.hp=0; burst(player.x,player.y,"#ff6b7a",40,6); addShake(14); die(); return; }

    // bullet vs enemy
    for(const b of bullets){
      for(const e of enemies){
        if(b.hits.includes(e))continue;
        const rr=b.r+e.r;
        if(dist2(b.x,b.y,e.x,e.y)<rr*rr){
          e.hp-=b.dmg; e.hit=6; b.hits.push(e);
          burst(b.x,b.y,e.color,5,3); addShake(1);
          applyKnockback(e, player.x, player.y, e.big?0.8:2);   // mild; mini/boss immune
          if(b.pierce-->0){}else{ b.dead=true; }
          break;
        }
      }
    }

    // resolve deaths (covers bullets, blades, explosions)
    function killReward(e){
      kills++;
      burst(e.x,e.y,e.color,e.boss?60:e.big?28:12,e.boss?8:e.big?6:4);
      addShake(e.boss?14:e.big?6:2); sfx.kill();
      if(e.boss){
        for(let i=0;i<14;i++) orbs.push({x:e.x+rand(-34,34),y:e.y+rand(-34,34),r:4,v:5});
        player.hp=Math.min(player.maxhp,player.hp+30);
        drops.push({x:e.x,y:e.y,r:13,type:"power"});   // power token — choose an ability
        bannerText="BOSS DOWN"; bannerT=100; sfx.bossdown();
      } else if(e.mini){
        for(let i=0;i<8;i++) orbs.push({x:e.x+rand(-24,24),y:e.y+rand(-24,24),r:4,v:3});
        player.hp=Math.min(player.maxhp,player.hp+12);
        drops.push({x:e.x,y:e.y,r:12,type:"magnet"});  // magnet — vacuums all XP gems
        bannerText="MINIBOSS DOWN"; bannerT=80; sfx.bossdown();
      } else {
        orbs.push({x:e.x,y:e.y,r:4,v:e.big?5:1});
      }
      // explosive rounds: detonate, hurting nearby enemies (crowd tool — heavily
      // reduced vs minibosses/bosses so chained blasts can't burst them down)
      if(player.explosive>0){
        const R=30+player.explosive*10, dmg=13+player.explosive*7;
        burst(e.x,e.y,"#ffb24a",18,6);
        for(const o of enemies){ if(o!==e && !o.dead && dist2(o.x,o.y,e.x,e.y)<R*R){
          o.hp -= (o.mini||o.boss) ? dmg*0.15 : dmg; o.hit=6; } }
      }
      // life leech: heal a tiny amount on each kill
      if(player.lifesteal>0) player.hp=Math.min(player.maxhp, player.hp+player.lifesteal*0.1);
    }
    for(const e of enemies){ if(!e.dead && e.hp<=0){ e.dead=true; killReward(e); } }

    bullets=bullets.filter(b=>!b.dead);
    enemies=enemies.filter(e=>!e.dead);

    // orbs magnet + pickup
    for(const o of orbs){
      const d=dist2(o.x,o.y,player.x,player.y);
      if(d<120*120){ const a=Math.atan2(player.y-o.y,player.x-o.x); const pull=Math.min(7,9000/(Math.sqrt(d)+1)); o.x+=Math.cos(a)*pull; o.y+=Math.sin(a)*pull; }
      if(d<(player.r+8)*(player.r+8)){ o.dead=true; player.xp+=o.v*XP_MULT; burst(o.x,o.y,"#5ad1ff",4,2); }
    }
    orbs=orbs.filter(o=>!o.dead);

    // pickups (boss power token + miniboss magnet) — magnet toward player, then resolve
    for(const dp of drops){
      const d=dist2(dp.x,dp.y,player.x,player.y);
      if(d<150*150){ const a=Math.atan2(player.y-dp.y,player.x-dp.x); const pull=Math.min(6,8000/(Math.sqrt(d)+1)); dp.x+=Math.cos(a)*pull; dp.y+=Math.sin(a)*pull; }
      if(d<(player.r+dp.r)*(player.r+dp.r)){
        dp.dead=true; addShake(5);
        if(dp.type==="magnet"){                 // vacuum every XP gem on the map (once)
          for(const o of orbs){ player.xp+=o.v*XP_MULT; }
          burst(dp.x,dp.y,"#5ad1ff",30,6); orbs=[];
          bannerText="MAGNET — XP COLLECTED"; bannerT=90; tone(680,0.18,"square",0.05,420);
        } else {                                // power token
          burst(dp.x,dp.y,"#ffd25a",24,5); showUpgradeChoice("BOSS REWARD","Choose a power","#ffd25a");
        }
      }
    }
    drops=drops.filter(dp=>!dp.dead);

    while(player.xp>=player.xpNext){ levelUp(); }

    // particles
    for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life--; }
    particles=particles.filter(p=>p.life>0);

    if(shake>0)shake*=0.85;
  }

  // ---- render ----
  function render(){
    const sx=(Math.random()-0.5)*shake, sy=(Math.random()-0.5)*shake;
    // clear the viewport (screen space)
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="#05050a"; ctx.fillRect(0,0,W,H);
    // enter world space: camera offset + shake
    ctx.save();
    ctx.translate(-cam.x+sx, -cam.y+sy);
    // grid over the visible region only
    ctx.strokeStyle="#0d1018"; ctx.lineWidth=1;
    const gx0=Math.floor(cam.x/40)*40, gy0=Math.floor(cam.y/40)*40;
    for(let x=gx0;x<=cam.x+W;x+=40){ctx.beginPath();ctx.moveTo(x,cam.y);ctx.lineTo(x,cam.y+H);ctx.stroke();}
    for(let y=gy0;y<=cam.y+H;y+=40){ctx.beginPath();ctx.moveTo(cam.x,y);ctx.lineTo(cam.x+W,y);ctx.stroke();}
    // world boundary so you can see the edges of the arena
    ctx.strokeStyle="#33374f"; ctx.lineWidth=4; ctx.strokeRect(0,0,WORLD_W,WORLD_H);

    // orbs
    for(const o of orbs){ ctx.fillStyle="#5ad1ff"; ctx.shadowColor="#5ad1ff"; ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill(); }
    ctx.shadowBlur=0;

    // pickups: gold diamond = boss power token, cyan diamond = miniboss magnet
    for(const dp of drops){
      const s=dp.r+3*Math.sin(time*0.15), magnet=dp.type==="magnet";
      ctx.save(); ctx.translate(dp.x,dp.y); ctx.rotate(time*0.04);
      ctx.fillStyle=magnet?"#7fe9ff":"#ffe08a"; ctx.shadowColor=magnet?"#39e0ff":"#ffae00"; ctx.shadowBlur=18;
      ctx.fillRect(-s/2,-s/2,s,s);
      ctx.restore();
    }
    ctx.shadowBlur=0;

    // enemies (+ ability telegraphs + floating health bars)
    for(const e of enemies){
      // telegraph (drawn under the body)
      if(e.tele>0 && e.teleKind){
        const t=1-e.tele/e.teleMax;
        if(e.teleKind==="charge" && e.chargeAim){
          ctx.strokeStyle="rgba(255,94,196,"+(0.25+0.55*t)+")"; ctx.lineWidth=3;
          ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.chargeAim.x,e.chargeAim.y);ctx.stroke();
        } else if(e.teleKind==="ring"){
          ctx.strokeStyle="rgba(176,107,255,"+(0.25+0.6*t)+")"; ctx.lineWidth=3+5*t;
          ctx.beginPath();ctx.arc(e.x,e.y,e.r+12+26*t,0,7);ctx.stroke();
        } else if(e.teleKind==="slam" && e.slamTarget){
          const tg=e.slamTarget;
          ctx.strokeStyle="rgba(255,107,122,"+(0.4+0.5*t)+")"; ctx.lineWidth=3;
          ctx.beginPath();ctx.arc(tg.x,tg.y,tg.R,0,7);ctx.stroke();
          ctx.fillStyle="rgba(255,107,122,"+(0.18*t)+")";
          ctx.beginPath();ctx.arc(tg.x,tg.y,tg.R*t,0,7);ctx.fill();
        }
      }
      // body (white flash on hit, flicker while winding up an ability)
      ctx.fillStyle = (e.hit>0 || (e.tele>0 && Math.floor(e.tele*12)%2)) ? "#ffffff" : e.color;
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
      if(e.big){ ctx.strokeStyle="#ffd25a"; ctx.lineWidth=2; ctx.beginPath();
        ctx.arc(e.x,e.y,e.r+4,-Math.PI/2,-Math.PI/2+Math.PI*2*(e.hp/e.maxhp)); ctx.stroke(); }
      // floating HP bar for minibosses & boss
      if(e.mini||e.boss){
        const bw=e.r*2.2, bx=e.x-bw/2, by=e.y-e.r-12;
        ctx.fillStyle="#1a0f24"; ctx.fillRect(bx,by,bw,4);
        ctx.fillStyle=e.boss?"#b06bff":"#ff5ec4"; ctx.fillRect(bx,by,bw*Math.max(0,e.hp/e.maxhp),4);
      }
    }
    // enemy bullets
    ctx.fillStyle="#ff8ad1"; ctx.shadowColor="#ff5ec4"; ctx.shadowBlur=8;
    for(const b of eBullets){ ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill(); }
    ctx.shadowBlur=0;
    // shock nova rings
    for(const nv of novas){ ctx.strokeStyle="rgba(126,255,192,"+Math.max(0,nv.life/nv.maxlife)+")"; ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(nv.x,nv.y,nv.r,0,7);ctx.stroke(); }

    // bullets (turn orange when explosive rounds are active)
    ctx.fillStyle=player.explosive>0?"#ffb24a":"#fff3b0";
    ctx.shadowColor=player.explosive>0?"#ff7b3a":"#ffd25a"; ctx.shadowBlur=8;
    for(const b of bullets){ ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill(); }
    ctx.shadowBlur=0;

    // particles
    for(const p of particles){ ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill(); }
    ctx.globalAlpha=1;

    // orbiting blades (bright cyan, with a spoke so they read clearly)
    if(!gameOver) for(const p of player.orbPos){
      ctx.strokeStyle="rgba(120,240,255,.35)"; ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(p.x,p.y);ctx.stroke();
      ctx.fillStyle="#e6fbff"; ctx.shadowColor="#39e0ff"; ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();
      ctx.shadowBlur=0;
    }

    // player (blinks while invulnerable)
    if(!gameOver && !(player.invuln>0 && Math.floor(player.invuln/6)%2)){
      ctx.fillStyle="#8effc0"; ctx.shadowColor="#8effc0"; ctx.shadowBlur=12;
      ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();
      ctx.shadowBlur=0;
    }
    ctx.restore();

    // --- screen-space UI (no shake) ---
    // wave progress bar (top-center): completed / current / remaining
    {
      const n=TOTAL_WAVES, segW=58, gap=8, totalW=n*segW+(n-1)*gap;
      const x0=(W-totalW)/2, y0=12, bh=6;
      for(let i=0;i<n;i++){
        const wn=i+1, x=x0+i*(segW+gap);
        if(wn<wave){                                   // completed
          ctx.fillStyle="#8effc0"; ctx.fillRect(x,y0,segW,bh);
        } else if(wn===wave){                          // current (highlighted, fills with progress)
          ctx.fillStyle="#10131f"; ctx.fillRect(x,y0,segW,bh);
          const cfg=WAVES[wave];
          const prog = wavePhase==="boss" ? 1 : (cfg?Math.min(((time-waveStart)/60)/cfg.minDuration,1):1);
          ctx.fillStyle="#5ad1ff"; ctx.fillRect(x,y0,segW*prog,bh);
          ctx.strokeStyle="#9fe6ff"; ctx.lineWidth=1; ctx.strokeRect(x+.5,y0+.5,segW-1,bh-1);
        } else {                                       // remaining (dim)
          ctx.fillStyle="#23233a"; ctx.fillRect(x,y0,segW,bh);
        }
      }
      // single combined info line beneath the bar (no overlap with corner HUD)
      const cfg=WAVES[wave];
      let label = wave>n ? "ALL CLEAR" : ("WAVE "+wave+"/"+n);
      if(cfg && wavePhase==="fight"){
        label += "    ◣ MINI "+fmt((nextMini-time)/60)+"    ◆ BOSS "+fmt(cfg.minDuration-(time-waveStart)/60);
      } else if(wavePhase==="boss"){
        label += "    ◆ BOSS ACTIVE";
      }
      ctx.fillStyle="#9fb3d0"; ctx.font="10px monospace"; ctx.textAlign="center";
      ctx.fillText(label, W/2, y0+bh+13);
    }

    // boss health bar
    const boss=enemies.find(e=>e.boss);
    if(boss){
      const bw=W*0.6, bx=(W-bw)/2, by=H-22;
      ctx.fillStyle="#1a0f24"; ctx.fillRect(bx,by,bw,10);
      ctx.fillStyle="#b06bff"; ctx.fillRect(bx,by,bw*Math.max(0,boss.hp/boss.maxhp),10);
      ctx.strokeStyle="#7a4fc0"; ctx.strokeRect(bx+.5,by+.5,bw-1,9);
      ctx.fillStyle="#cfa8ff"; ctx.font="10px monospace"; ctx.textAlign="center";
      ctx.fillText("BOSS", W/2, by-4);
    }
    // banner
    if(bannerT>0){
      ctx.globalAlpha=Math.min(1,bannerT/30);
      ctx.fillStyle="#cfa8ff"; ctx.font="700 28px monospace"; ctx.textAlign="center";
      ctx.fillText(bannerText, W/2, H*0.32);
      ctx.globalAlpha=1;
    }

    // loadout readout — picked abilities visibly show here
    const load=[];
    if(player.bullets>1)   load.push("✦ shots x"+player.bullets);
    if(player.pierce>0)    load.push("→ pierce "+player.pierce);
    if(player.orbiters>0)  load.push("◉ blade x"+player.orbiters);
    if(player.explosive>0) load.push("✸ boom x"+player.explosive);
    if(load.length){
      ctx.font="11px monospace"; ctx.textAlign="left";
      ctx.fillStyle="#7fe9ff";
      load.forEach((s,i)=>ctx.fillText(s, 12, H-12-i*15));
    }

    drawSticks();
  }

  function drawSticks(){
    ctx.setTransform(1,0,0,1,0,0);
    const stick=(s,col)=>{
      if(!s.active) return;
      ctx.globalAlpha=0.22; ctx.strokeStyle=col; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(s.ox,s.oy,STICK_R,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=0.5; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(s.cx,s.cy,22,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    };
    stick(moveStick,"#5ad1ff");
    stick(aimStick,"#ff8a5a");
  }

  function syncHud(){
    hud.lvl.textContent=player.level;
    hud.time.textContent=Math.floor(time/60);
    hud.hp.textContent=Math.ceil(player.hp);
    hud.kills.textContent=kills;
    hud.fill.style.width=(100*player.xp/player.xpNext)+"%";
  }

  // Fixed-timestep loop: the simulation always advances exactly 60 logical
  // steps per real second, independent of the display's refresh rate or any
  // frame hitches — so the game pace is constant everywhere.
  const STEP=1000/60;                  // ms per logical step (60 Hz)
  function loop(ts){
    let elapsed=ts-lastTs; lastTs=ts;
    if(elapsed>250) elapsed=250;       // clamp big gaps (tab switch) to avoid a catch-up burst
    acc+=elapsed;
    // consume ALL accumulated real time each frame (cap covers the 250ms clamp ≈15 steps)
    // so the sim keeps real-time pace even when the display refresh rate dips.
    let steps=0;
    while(acc>=STEP && steps<16){ update(1); acc-=STEP; steps++; }  // dt=1 per fixed step
    render(); syncHud();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
